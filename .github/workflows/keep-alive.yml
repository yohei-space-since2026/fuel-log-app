name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 3 */3 * *" # 3日おき、UTC 3:00(JST正午ごろ)
  workflow_dispatch: {} # 手動実行もできるように

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/setup?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
