name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 3 * * *"   # 毎日 UTC 3:00(日本時間 正午ごろ)
  workflow_dispatch: {}    # 手動実行もできるように

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          for t in setup entries; do
            curl -sS --fail -o /dev/null -w "$t: %{http_code}\n" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/$t?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
          done
